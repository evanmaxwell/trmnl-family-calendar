- keyname: author_bio
  name: Calendar + Weather
  field_type: author_bio
  email_address: guplem@gmail.com
  category: calendar,environment
  github_url: https://github.com/guplem/trmnl-cal-weather
  learn_more_url: https://github.com/guplem/trmnl-cal-weather#readme

- keyname: compatibility_notice
  name: Device compatibility
  field_type: description
  description: "Designed for the <b>TRMNL (OG)</b> in <b>full</b> view (800x480). Also fits the <b>TRMNL (X)</b> (1872x1404). On the OG, enable the <a class='underline' href='https://help.trmnl.com/en/articles/12985974-understanding-color-palettes' target='_blank'>2-bit palette</a> (available with <a class='underline' href='https://github.com/usetrmnl/trmnl-firmware/releases/tag/v1.6.0#:~:text=Adds%202%2Dbit%20grayscale' target='_blank'>firmware &gt;=1.6.0</a>)."

- keyname: trmnl_api_key
  name: TRMNL API Key
  field_type: password
  description: "Your personal API key from <a class='underline' href='https://trmnl.com/account' target='_blank'>trmnl.com/account</a>. Needed to read your TRMNL Calendar plugin data."
  help_text: "This is kept private and only used to poll your own calendar plugin"
  placeholder: "user_..."
  group: Calendar

- keyname: calendar_plugin_id
  name: Calendar Plugin ID
  field_type: string
  description: "Your TRMNL Calendar <code>plugin_setting_id</code> (set its Data Provider to <b>iPhone App</b> and select your calendars in the <a class='underline' href='https://help.trmnl.com/en/articles/12294875-trmnl-companion-for-ios' target='_blank'>TRMNL Companion for iOS</a> app). Find the numeric ID in the URL when editing your Calendar plugin: <code>usetrmnl.com/plugin_settings/<b>12345</b>/edit</code>."
  help_text: "The numeric ID, not the full URL"
  placeholder: "12345"
  group: Calendar

- keyname: cal_solid_black
  name: Solid black bar calendar(s)
  field_type: string
  optional: true
  description: "Calendar name(s) or iOS calendar color(s) drawn with a solid black bar (bar 1). Separate multiple calendars with commas. Use <code>Pink=Primary</code> or <code>Calendar Name=Label</code> to set the legend label."
  help_text: "Matches calendar names, iOS color names (Pink, Red, Orange, Yellow, Green, Blue, Purple, Brown), or hex codes"
  placeholder: "Pink=Primary"
  group: Calendar

- keyname: cal_solid_gray
  name: Solid gray bar calendar(s)
  field_type: string
  optional: true
  description: "Calendar name(s) or iOS calendar color(s) drawn with a solid gray bar (bar 0). Separate multiple calendars with commas. Use <code>Red=Birthdays</code> or <code>Calendar Name=Label</code> to set the legend label."
  help_text: "Matches calendar names, iOS color names, or hex codes"
  placeholder: "Red=Birthdays"
  group: Calendar

- keyname: cal_diag_stripes
  name: Diagonal stripe bar calendar(s)
  field_type: string
  optional: true
  description: "Calendar name(s) or iOS calendar color(s) drawn with black diagonal stripes (bar 4). Separate multiple calendars with commas. Use <code>Orange=D&amp;D</code> or <code>Calendar Name=Label</code> to set the legend label."
  help_text: "Matches calendar names, iOS color names, or hex codes"
  placeholder: "Orange=D&D"
  group: Calendar

- keyname: cal_horiz_stripes
  name: Horizontal stripe bar calendar(s)
  field_type: string
  optional: true
  description: "Calendar name(s) or iOS calendar color(s) drawn with black horizontal stripes (bar 7). Separate multiple calendars with commas. Use <code>Blue=Work</code> or <code>Calendar Name=Label</code> to set the legend label."
  help_text: "Matches calendar names, iOS color names, or hex codes"
  placeholder: "Blue=Work"
  group: Calendar

- keyname: cal_outlined
  name: Outlined bar calendar(s)
  field_type: string
  optional: true
  description: "Calendar name(s) or iOS calendar color(s) drawn with a white outlined bar (bar 2). Separate multiple calendars with commas. Use <code>Brown=Meals</code> or <code>Calendar Name=Label</code> to set the legend label."
  help_text: "Matches calendar names, iOS color names, or hex codes"
  placeholder: "Brown=Meals"
  group: Calendar

- keyname: cal_inverted
  name: Inverted (white on black) calendar(s)
  field_type: string
  optional: true
  description: "Calendar name(s) or iOS calendar color(s) drawn inverted as white text on solid black (typically Holidays, and shown under today's date in Month view). Separate multiple calendars with commas. Use <code>Green=Holidays</code> to set the legend label."
  help_text: "Matches calendar names, iOS color names, or hex codes"
  placeholder: "Green=Holidays"
  group: Calendar

- keyname: ignored_phrases
  name: Ignored phrases
  field_type: string
  optional: true
  description: "Comma-separated patterns, each a case-insensitive regular expression tested against the event title and description. Plain text means 'contains'; use <code>^Work$</code> for an exact match or <code>\\bWork\\b</code> for a whole word."
  help_text: "Patterns cannot contain commas"
  placeholder: "^Work$, ^Focus Time$"
  group: Calendar

- keyname: day_notes
  name: Weekly day notes
  field_type: string
  optional: true
  description: "Recurring notes pinned to the bottom of weekday columns in the Week Agenda view. Format as <code>Day=Note</code>, separated by commas or semicolons."
  help_text: "Use full or short weekday names (e.g. Monday=Trash & recycling, Wed=Compost)"
  placeholder: "Monday=Trash & recycling, Wednesday=Compost, Thursday=Trash"
  group: Calendar

- keyname: latitude
  name: Latitude
  field_type: string
  description: "Your location's latitude. Find it at <a href='https://open-meteo.com/en/docs' target='_blank'>open-meteo.com</a>"
  placeholder: "41.39"
  group: Location

- keyname: longitude
  name: Longitude
  field_type: string
  description: "Your location's longitude"
  placeholder: "2.17"
  group: Location

- keyname: timezone
  name: Timezone
  field_type: time_zone
  description: "Your local timezone (must match your TRMNL timezone)"
  group: Location

- keyname: show_render_time
  name: Show render time
  field_type: boolean
  description: "Display the render time in the bottom bar"
  default: "false"
  group: Display

- keyname: show_diagnostics
  name: Show diagnostic overlay
  field_type: boolean
  description: "Show an on-screen pop-up when data issues are detected (e.g. weather or calendar fetch failures). Recommended ON during setup. Once the device is working reliably, turn this OFF: transient errors (like a single failed weather call) resolve on the next refresh, and the overlay covers a large portion of the calendar."
  default: "true"
  group: Display
